services:
  neo4j:
    image: neo4j:5.26-community
    container_name: openabox-neo4j
    restart: unless-stopped
    ports:
      # OPENABOX_BIND defaults to every interface, which is what makes the
      # stack reachable from other machines on the network. Set it to
      # 127.0.0.1 in .env to keep the instance to the host it runs on.
      - "${OPENABOX_BIND:-0.0.0.0}:${NEO4J_HTTP_PORT:-7474}:7474"   # Browser
      - "${OPENABOX_BIND:-0.0.0.0}:${NEO4J_BOLT_PORT:-7687}:7687"   # Bolt
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-openabox-local}"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_server_memory_heap_initial__size: "${NEO4J_HEAP_INITIAL:-1G}"
      NEO4J_server_memory_heap_max__size: "${NEO4J_HEAP_MAX:-2G}"
      NEO4J_server_memory_pagecache_size: "${NEO4J_PAGECACHE:-1G}"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - ./data/import:/import
    healthcheck:
      # cypher-shell exits non-zero until the DB actually accepts queries
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-openabox-local} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 40s

  api:
    build: ./api
    container_name: openabox-api
    restart: unless-stopped
    ports:
      - "${OPENABOX_BIND:-0.0.0.0}:${OPENABOX_API_PORT:-8000}:8000"
    environment:
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "neo4j"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-openabox-local}"
    env_file:
      # Optional: the stack starts without a .env, it just has no API key and
      # so cannot fetch anything the graph does not already hold. Needs
      # Docker Compose v2.24 or newer for the `required` key.
      - path: .env
        required: false
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      # Application code is bind-mounted read-only, so pulling a new revision
      # and restarting the container is enough — no rebuild unless
      # requirements.txt changed.
      - ./api/app:/srv/app:ro

volumes:
  neo4j-data:
  neo4j-logs:
